<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#252525">
<title>НИНИ · Кондитеры</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geologica:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;
  --ink:#252525; --paper:#FFFFFF; --card:#FAF8F6; --olive:#8F883D; --olive-ink:#6E6829;
  --pink:#F8BDC4; --pink-soft:#FCE6E9; --silver:#BDB3B3; --muted:#7D7671;
  --line:rgba(37,37,37,.12); --grid:rgba(37,37,37,.07); --warn:#B0473F;
  --bar:#252525; --bar-ink:#FAF8F6; --hl:#F3F0D9;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:Geologica,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--paper);color:var(--ink);
  font-size:17px;line-height:1.5;font-weight:300;font-variant-numeric:tabular-nums}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--olive);outline-offset:2px}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:20;background:var(--bar);color:var(--bar-ink);padding:10px 16px 0;padding-top:max(10px,env(safe-area-inset-top))}
.row1{display:flex;align-items:center;gap:10px}
.logo{font-weight:700;font-size:22px;letter-spacing:-.08em;line-height:1;white-space:nowrap}
.logo i{font-style:normal;display:inline-block;transform:scaleX(-1)}
.logo small{font-size:11px;letter-spacing:.18em;font-weight:600;margin-left:8px;opacity:.7;text-transform:uppercase}
.search{flex:1;min-width:0;height:44px;border-radius:22px;border:0;padding:0 16px;background:rgba(250,248,246,.12);color:var(--bar-ink);font-size:16px}
.search::placeholder{color:rgba(250,248,246,.55)}
.ibtn{height:44px;min-width:44px;border-radius:22px;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;
  background:rgba(250,248,246,.12);font-size:13px;font-weight:600;white-space:nowrap}
.ibtn[aria-pressed="true"]{background:var(--olive);color:#fff}
.ibtn[hidden]{display:none}
.ibtn svg{width:20px;height:20px;flex:none}
.ibtn .lbl{display:none}
.ibtn .cnt{background:var(--pink);color:#252525;border-radius:10px;padding:0 6px;font-size:12px;line-height:18px}
@media (min-width:700px){.ibtn .lbl{display:inline}}
@media (max-width:480px){.logo small{display:none}}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 10px;scrollbar-width:none;margin:0 -16px;padding-left:16px;padding-right:16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 14px;border-radius:18px;border:1px solid rgba(250,248,246,.25);font-size:14px;font-weight:400;white-space:nowrap}
.chip span{opacity:.55;margin-left:4px;font-size:12px}
.chip[aria-pressed="true"]{background:var(--bar-ink);color:var(--bar);border-color:var(--bar-ink);font-weight:600}

/* allergen panel */
.algpanel{display:none;padding:4px 0 12px}
.algpanel.on{display:block}
.algpanel p{font-size:13px;opacity:.75;margin-bottom:8px}
.algs{display:flex;flex-wrap:wrap;gap:6px}
.alg{height:36px;padding:0 14px;border-radius:18px;border:1px solid rgba(250,248,246,.25);font-size:14px}
.alg[aria-pressed="true"]{background:var(--pink);color:#252525;border-color:var(--pink);font-weight:600;text-decoration:line-through}
.alg.clear{border-style:dashed;opacity:.8}

/* ---------- layout ---------- */
.wrap{display:block}
.list{padding:8px 0 40px}
.detail{display:none}
body.showing .list{display:none}
body.showing .detail{display:block}
@media (min-width:900px){
  .wrap{display:grid;grid-template-columns:minmax(320px,380px) 1fr;height:calc(100vh - var(--toph,110px))}
  .list{display:block !important;overflow-y:auto;border-right:1px solid var(--line);padding-bottom:40px}
  .detail{display:block !important;overflow-y:auto}
  .back{display:none !important}
}
.count{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:10px 16px 6px}
.note{margin:4px 16px 8px;padding:10px 12px;border-radius:10px;background:var(--pink-soft);font-size:14px}
.sechead{font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--olive-ink);padding:18px 16px 6px}
.item{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:10px 16px;min-height:72px;border-bottom:1px solid var(--line)}
.item[aria-current="true"]{background:var(--hl)}
.th{width:56px;height:56px;border-radius:10px;flex:none;object-fit:cover;background:var(--grid);display:flex;align-items:center;justify-content:center;
  font-weight:700;color:var(--silver);font-size:20px}
.it{min-width:0;flex:1}
.nm{font-weight:600;font-size:16px;line-height:1.25}
.sub{font-size:13px;color:var(--muted);margin-top:2px}
.mini{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--silver);color:var(--muted);
  border-radius:4px;padding:1px 5px;margin:4px 4px 0 0}
.mini.draft{border-color:var(--olive);color:var(--olive-ink)}
.empty{padding:50px 16px;text-align:center;color:var(--muted)}
.foot{padding:24px 16px 8px;font-size:13px;color:var(--muted);line-height:1.6}
.foot b{color:var(--ink);font-weight:600}

/* ---------- card ---------- */
.detail-in{max-width:980px;padding:0 16px 80px}
.back{position:sticky;top:var(--toph,110px);z-index:5;display:flex;align-items:center;gap:6px;height:48px;width:calc(100% + 32px);margin:0 -16px;padding:0 16px;
  background:var(--paper);border-bottom:1px solid var(--line);font-weight:600;font-size:15px}
.back svg{width:20px;height:20px}
.hd{padding:18px 0 8px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--olive-ink)}
h1{font-size:28px;line-height:1.1;font-weight:700;letter-spacing:-.02em;margin:6px 0 10px}
.facts{display:flex;flex-wrap:wrap;gap:8px}
.fact{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-size:13px;color:var(--muted)}
.fact b{display:block;color:var(--ink);font-size:17px;font-weight:600}
.tags{margin-top:8px}
.cols{display:grid;gap:24px;margin-top:16px}
@media (min-width:1200px){.cols{grid-template-columns:minmax(300px,420px) 1fr}}
.shot{margin:0}
.shot img{width:100%;display:block;border-radius:12px;background:var(--grid)}
.shot figcaption{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-top:6px;font-weight:600}
h2{font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.cols > div > h2:first-child{margin-top:0}

.stepper{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:10px}
.stepper .l{font-size:14px;color:var(--muted);flex:1;min-width:120px}
.stepper .l b{color:var(--ink);font-weight:600}
.sbtn{width:48px;height:48px;border-radius:24px;background:var(--ink);color:var(--paper);font-size:26px;line-height:1;font-weight:300}
.sbtn:disabled{opacity:.25}
.sval{width:64px;height:48px;text-align:center;font-size:24px;font-weight:700;border:1px solid var(--line);border-radius:12px;background:var(--paper)}
.quick{display:flex;gap:6px;width:100%}
.quick button{flex:1;height:36px;border-radius:10px;border:1px solid var(--line);font-size:14px}
.quick button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

.ledger{background-image:linear-gradient(to right,var(--grid) 1px,transparent 1px),linear-gradient(to bottom,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;border-top:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink);padding:4px 0}
.ln{display:flex;align-items:baseline;gap:8px;padding:8px 6px;font-size:17px}
.ln + .ln{border-top:1px dashed var(--line)}
.ln .ing{font-weight:400}
.ln .dots{flex:1;border-bottom:1px dotted var(--silver);transform:translateY(-4px);min-width:12px}
.ln .g{font-weight:700;white-space:nowrap;text-align:right}
.ln .g small{display:block;font-weight:300;font-size:12px;color:var(--muted)}
.ln.scaled .g{color:var(--olive-ink)}
.ln.miss .g{background:var(--pink-soft);padding:0 6px;border-radius:6px;font-weight:600}
.hint{font-size:13px;color:var(--muted);margin-top:8px}

.tech{font-size:17px;line-height:1.6}
.tech p{margin-bottom:12px}
.tech b,.tech strong{font-weight:700}
.algbox{margin-top:18px;border-left:4px solid var(--pink);background:var(--pink-soft);border-radius:0 12px 12px 0;padding:12px 14px;font-size:16px}
.algbox b{font-weight:700}
.store{margin-top:10px;border-left:4px solid var(--olive);background:var(--card);border-radius:0 12px 12px 0;padding:12px 14px;font-size:15px}
.store b{font-weight:700}
details.q{margin-top:18px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
details.q summary{cursor:pointer;padding:12px 14px;font-size:14px;font-weight:600;color:var(--muted);list-style:none}
details.q summary::-webkit-details-marker{display:none}
details.q summary::before{content:"▸ ";}
details.q[open] summary::before{content:"▾ ";}
details.q ul{padding:0 14px 12px 32px;font-size:14px}
details.q li{margin-bottom:6px}
.placeholder{padding:80px 24px;text-align:center;color:var(--muted)}
.placeholder .big{font-size:48px;font-weight:700;letter-spacing:-.08em;color:var(--silver);margin-bottom:12px}

/* storage view */
.st{padding:10px 16px;border-bottom:1px solid var(--line)}
.st .n{font-weight:600}
.st .t{font-weight:700;color:var(--olive-ink)}
.st .t.gap{color:var(--warn)}
.st .w{font-size:14px;color:var(--muted)}
.st .r{font-size:13px;color:var(--muted);margin-top:2px}

.toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--paper);
  border-radius:22px;padding:10px 18px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<header class="top" id="top">
  <div class="row1">
    <span class="logo">Н<i>Н</i><small>кондитеры</small></span>
    <input class="search" id="q" type="search" placeholder="Блюдо или продукт" aria-label="Поиск по блюдам и продуктам" autocomplete="off">
    <button class="ibtn" id="bAlg" aria-pressed="false" aria-controls="algpanel" title="Фильтр аллергенов">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 5h18M6 12h12M10 19h4"/></svg>
      <span class="lbl">Аллергены</span><span class="cnt" id="algCnt" hidden></span>
    </button>
    <button class="ibtn" id="bStore" aria-pressed="false" title="Сроки хранения">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/></svg>
      <span class="lbl">Хранение</span>
    </button>
    <button class="ibtn" id="bWake" aria-pressed="false" title="Не гасить экран">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <span class="lbl">Экран</span>
    </button>
  </div>
  <div class="algpanel" id="algpanel">
    <p>Отметьте, чего <b>не должно быть</b> в блюде — такие позиции скроются. Следы и «может содержать» тоже считаются.</p>
    <div class="algs" id="algs"></div>
  </div>
  <nav class="chips" id="chips" aria-label="Разделы"></nav>
</header>

<div class="wrap">
  <section class="list" id="list" aria-label="Список позиций"></section>
  <section class="detail" id="detail" aria-live="polite"></section>
</div>
<div class="toast" id="toast" role="status"></div>

<script>

ны «тара 250 мл» и «пропитка» — это относится к безглютеновой линейке?", "Нет состава и рецептуры мусса.", "Вишня в роме — алкоголь; для детей и беременных нужно предупреждение."], "g": ["gluten free"], "img": "img/064.jpg", "th": "img/064-t.jpg"}, {"id": 65, "s": "Торты", "n": "Крем — базовая заготовка", "o": "1,7 л до взбивания", "p": "", "k": "", "kl": "КБЖУ на 100 г", "c": [["Сливки растительные Chantypak, Puratos", "1 пачка · 1 л"], ["Вода", "700 мл"], ["Ванилин", "3 упаковки"], ["Ароматизатор «пломбир»", "5–7 капель"], ["Соль", "2 ч. л. (10 г)"], ["Сахарозаменитель в таблетках", "40 таблеток"]], "t": "<p><b>1.<\/b> Сахарозаменитель в таблетках растворить в небольшом количестве воды из общей нормы.<\/p><p><b>2.<\/b> Сливки Chantypak 1 л начать взбивать, параллельно вводя холодную воду 700 мл порциями.<\/p><p><b>3.<\/b> Взбивать до состояния густой сметаны, не перебивая массу.<\/p><p><b>4.<\/b> Ввести ванилин, ароматизатор «пломбир», соль и растворённый сахарозаменитель, вымешать до однородности.<\/p><p><b>5.<\/b> Использовать сразу либо хранить по утверждённому режиму.<\/p><p><b>Оформление.<\/b> Взбитая кремовая основа для всех муссовых тортов. Во всех картах раздела «крем» означает именно этот полуфабрикат.<\/p>", "a": "По спецификации Puratos на Chantypak. Уточняется.", "comp": "", "f": ["Пищевая ценность: не рассчитана.", "Аллергены уточняются (по спецификации Puratos)."], "g": []}, {"id": 66, "s": "Торты", "n": "Желатин — базовая заготовка", "o": "≈ 220 мл массы", "p": "", "k": "31 / 7,7 / 0 / 0", "kl": "КБЖУ на 100 мл массы", "c": [["Желатин, сухой", "1 пачка · 20 г"], ["Вода", "200 мл"]], "t": "<p><b>1.<\/b> Желатин 20 г залить водой 200 мл, размешать, оставить набухать.<\/p><p><b>2.<\/b> Набухшую массу распустить до полного растворения кристаллов, не доводя до кипения.<\/p><p><b>3.<\/b> Охладить до рабочей температуры: масса должна оставаться текучей.<\/p><p><b>4.<\/b> Вводить в крем по норме карты, тонкой струёй, при непрерывном перемешивании.<\/p><p><b>5.<\/b> Пересчёт на карты: 20 мл массы — ≈ 1,8 г сухого желатина; 45 мл массы — ≈ 4,1 г; 60 мл массы — ≈ 5,5 г; 100 мл массы — ≈ 9,1 г.<\/p><p><b>Оформление.<\/b> Распущенная желатиновая масса. Во всех картах раздела указана именно она, в миллилитрах.<\/p>", "a": "Не заявлены.", "comp": "", "f": [], "g": []}, {"id": 67, "s": "Торты", "n": "Фисташка-малина", "o": "600 / 1000 г", "p": "", "k": "194 / 9,5 / 7,86 / 20,71", "kl": "КБЖУ на 100 г", "c": [["Фисташковый бисквит", "уточнить"], ["Крем — 1-й слой — малиновый мусс", "150 г"], ["Желатин, распущенный — 1-й слой — малиновый мусс", "45 мл (3 ст. л.)"], ["Малина кусочками — 1-й слой — малиновый мусс", "уточнить"], ["Крем — 2-й слой — фисташковый мусс", "350 г"], ["Желатин, распущенный — 2-й слой — фисташковый мусс", "100 мл"]], "t": "<p><b>1.<\/b> Фисташковый бисквит выпечь, охладить и выложить в форму по размеру изделия.<\/p><p><b>2.<\/b> Желатин распустить и охладить до рабочей температуры, не давая схватиться.<\/p><p><b>3.<\/b> Взбить крем 150 г, ввести желатин 45 мл (3 ст. л.), добавить малина кусочками вес уточняется. Залить первым слоем на бисквит.<\/p><p><b>4.<\/b> Заморозить слой 15–20 минут до схватывания, только потом заливать следующий.<\/p><p><b>5.<\/b> Взбить крем 350 г, ввести желатин 100 мл. Залить следующим слоем.<\/p><p><b>6.<\/b> Первый слой заморозить 15 минут, затем залить второй. Украсить свежей ягодой.<\/p><p><b>7.<\/b> Стабилизировать в холоде, извлечь из формы, оформить свежей ягодой и шоколадным медальоном НИНИ.<\/p><p><b>Оформление.<\/b> Муссовый торт на фисташковом бисквите: слой малинового мусса с кусочками ягод и воздушный фисташковый мусс. Украшаем свежей ягодой.<\/p><p><b>Реализация.<\/b> Целым изделием 600 / 1000 г. Нормы закладки даны на изделие 600 г.<\/p>", "a": "Яйца, орехи (фисташка), глютен.", "comp": "", "f": ["Фисташковый бисквит: масса бисквита на изделие не указана", "Малина кусочками — 1-й слой — малиновый мусс: вес уточняется"], "g": [], "img": "img/067.jpg", "th": "img/067-t.jpg"}, {"id": 68, "s": "Торты", "n": "Киндер-кантри", "o": "600 / 1000 г", "p": "", "k": "185 / 11 / 10 / 19", "kl": "КБЖУ на 100 г", "c": [["Шоколадный бисквит", "уточнить"], ["Крем — 1-й слой мусса", "100 г"], ["Желатин, распущенный — 1-й слой мусса", "20 мл"], ["Воздушный рис в шоколаде без сахара — 1-й слой мусса", "20 г"], ["Крем — 2-й слой мусса", "300 г"], ["Желатин, распущенный — 2-й слой мусса", "100 мл"], ["Ароматизатор «пломбир» — 2-й слой мусса", "4 капли"]], "t": "<p><b>1.<\/b> Шоколадный бисквит выпечь, охладить и выложить в форму по размеру изделия.<\/p><p><b>2.<\/b> Желатин распустить и охладить до рабочей температуры, не давая схватиться.<\/p><p><b>3.<\/b> Взбить крем 100 г, ввести желатин 20 мл, добавить воздушный рис в шоколаде без сахара 20 г. Залить первым слоем на бисквит.<\/p><p><b>4.<\/b> Заморозить слой 15–20 минут до схватывания, только потом заливать следующий.<\/p><p><b>5.<\/b> Взбить крем 300 г, ввести желатин 100 мл, добавить ароматизатор «пломбир» 4 капли. Залить следующим слоем.<\/p><p><b>6.<\/b> Стабилизировать в холоде, извлечь из формы, оформить свежей ягодой и шоколадным медальоном НИНИ.<\/p><p><b>Оформление.<\/b> Муссовый торт на шоколадном бисквите: сливочный мусс, дутый рис и шоколад без сахара. Украшаем свежей ягодой.<\/p><p><b>Реализация.<\/b> Целым изделием 600 / 1000 г. Нормы закладки даны на изделие 600 г.<\/p>", "a": "Яйца, глютен, соя, какао.", "comp": "", "f": ["Шоколадный бисквит: масса бисквита на изделие не указана"], "g": [], "img": "img/068.jpg", "th": "img/068-t.jpg"}, {"id": 69, "s": "Торты", "n": "Три шоколада", "o": "600 / 1000 г", "p": "", "k": "200 / 10,57 / 7,29 / 22,86", "kl": "КБЖУ на 100 г", "c": [["Шоколадный бисквит", "уточнить"], ["Крем на каждый слой — Мусс, три слоя", "150 г × 3 = 450 г"], ["Желатин, распущенный — Мусс, три слоя", "60 мл (4 ст. л.)"]], "t": "<p><b>1.<\/b> Шоколадный бисквит выпечь, охладить и выложить в форму по размеру изделия.<\/p><p><b>2.<\/b> Желатин распустить и охладить до const D=DATA.D, ST=DATA.ST, SECS=DATA.SECS;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");

// ---- safe local storage (per-device preferences only) ----
const LS={get(k,d){try{const v=localStorage.getItem("nini-k-"+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
          set(k,v){try{localStorage.setItem("nini-k-"+k,JSON.stringify(v))}catch(e){}}};

// ---- allergens: keyword stems matched against the card's allergen line ----
const ALG=[["Глютен","глютен"],["Молоко","молок"],["Яйца","яйц"],["Орехи","орех"],["Арахис","арахис"],["Рыба","рыб"],
  ["Ракообразные","ракообраз"],["Моллюски","моллюск"],["Соя","со[яи]\\b"],["Кунжут","кунжут"],["Горчица","горчиц"],["Кокос","кокос"],["Мак","\\bмак\\b"]];
let excl=new Set(LS.get("excl",[]));
const unknownAlg=d=>!d.a||d.a==="—"||/^уточнять/i.test(d.a);
function algOk(d){
  if(!excl.size) return true;
  if(unknownAlg(d)) return false;
  const a=d.a.toLowerCase();
  for(const [name,re] of ALG) if(excl.has(name)&&new RegExp(re,"i").test(a)) return false;
  return true;
}

// ---- state ----
let sec="Все", q="", view="cards", cur=null, portions=1;

// ---- section chips ----
const chips=$("chips");
SECS.forEach(s=>{
  const b=document.createElement("button");
  b.className="chip";b.setAttribute("aria-pressed",s===sec);b.dataset.s=s;
  const n=s==="Все"?D.length:D.filter(d=>d.s===s).length;
  b.innerHTML=esc(s)+"<span>"+n+"</span>";
  b.onclick=()=>{sec=s;view="cards";syncButtons();renderList();window.scrollTo(0,0);$("list").scrollTop=0;};
  chips.appendChild(b);
});

// ---- allergen chips ----
const algs=$("algs");
function drawAlgs(){
  algs.innerHTML=ALG.map(([n])=>'<button class="alg" aria-pressed="'+excl.has(n)+'" data-a="'+n+'">без: '+n.toLowerCase()+'</button>').join("")+
    (excl.size?'<button class="alg clear" data-a="">сбросить</button>':"");
  const c=$("algCnt");c.hidden=!excl.size;c.textContent=excl.size;
}
algs.onclick=e=>{
  const b=e.target.closest("button");if(!b)return;
  const a=b.dataset.a;
  if(!a) excl.clear(); else excl.has(a)?excl.delete(a):excl.add(a);
  LS.set("excl",[...excl]);drawAlgs();view==="store"?renderStore():renderList();
};
$("bAlg").onclick=()=>{const p=$("algpanel"),on=!p.classList.contains("on");p.classList.toggle("on",on);$("bAlg").setAttribute("aria-pressed",on||excl.size>0);measure();};

// ---- search ----
$("q").addEventListener("input",e=>{q=e.target.value.trim().toLowerCase();if(view==="store")renderStore();else renderList();});

// ---- storage view toggle ----
$("bStore").onclick=()=>{view=view==="store"?"cards":"store";syncButtons();if(view==="store"){closeCard(true);renderStore();}else renderList();};
function syncButtons(){
  $("bStore").setAttribute("aria-pressed",view==="store");
  [...chips.children].forEach(c=>c.setAttribute("aria-pressed",view==="cards"&&c.dataset.s===sec));
  $("bAlg").setAttribute("aria-pressed",$("algpanel").classList.contains("on")||excl.size>0);
}

// ---- screen wake lock ----
let wake=null, wantWake=false;
async function setWake(on){
  wantWake=on;
  if(!("wakeLock" in navigator)){toast("Этот браузер не умеет держать экран включённым");wantWake=false;}
  else if(on){try{wake=await navigator.wakeLock.request("screen");wake.addEventListener("release",()=>{wake=null;});toast("Экран не будет гаснуть, пока открыта страница");}
    catch(e){wantWake=false;toast("Не получилось: "+e.message);}}
  else{if(wake){await wake.release();wake=null;}toast("Экран гаснет как обычно");}
  $("bWake").setAttribute("aria-pressed",wantWake);
}
$("bWake").onclick=()=>setWake(!wantWake);

let tt;function toast(m){const t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("on"),2600);}

// ---- list ----
function matches(d){
  if(sec!=="Все"&&d.s!==sec) return false;
  if(!algOk(d)) return false;
  if(!q) return true;
  return (d.n+" "+d.s+" "+d.a+" "+d.c.map(x=>x[0]).join(" ")).toLowerCase().includes(q);
}
function tagHtml(t){
  const draft=t==="проект"||t==="заполнить";
  return '<span class="mini'+(draft?" draft":"")+'"'+(t==="проект"?' title="Карта расчётная, не проверена на проработке"':"")+'>'+esc(t)+'</span>';
}
function renderList(){
  const L=$("list");
  const list=D.filter(matches).sort((a,b)=>SECS.indexOf(a.s)-SECS.indexOf(b.s));
  const hidden=D.filter(d=>(sec==="Все"||d.s===sec)&&!algOk(d)).length;
  let h='<div class="count">'+(list.length?"Позиций: "+list.length:"")+'</div>';
  if(excl.size) h+='<div class="note">Скрыто '+hidden+' поз. по аллергенам (без: '+esc([...excl].join(", ").toLowerCase())+
     '). Позиции без подтверждённых аллергенов тоже скрыты. Перед подачей гостю с аллергией — уточнить у шефа.</div>';
  if(!list.length){L.innerHTML=h+'<p class="empty">Ничего не нашлось.<br>Попробуйте название продукта или другой раздел.</p>'+foot();return;}
  let last="";
  for(const d of list){
    if(sec==="Все"&&d.s!==last){h+='<div class="sechead">'+esc(d.s)+'</div>';last=d.s;}
    const tags=d.g.filter(t=>t==="проект"||t==="заполнить"||/free|protein|без сахара|остр/i.test(t)).map(tagHtml).join("");
    h+='<button class="item" data-id="'+d.id+'" aria-current="'+(cur&&cur.id===d.id)+'">'+
      (d.th?'<img class="th" src="'+d.th+'" alt="" loading="lazy" decoding="async">':'<span class="th">'+esc(d.n.replace(/[«»"]/g,"").charAt(0))+'</span>')+
      '<span class="it"><span class="nm">'+esc(d.n)+'</span><span class="sub"> · '+esc(d.o)+'</span>'+(tags?'<br>'+tags:'')+'</span></button>';
  }
  L.innerHTML=h+foot();
}
function foot(){
  return '<div class="foot"><b>Как читать.</b> Граммовки — нетто на 1 порцию, для полуфабрикатов — на 1 закладку, для тортов — на изделие 600 г. КБЖУ: ккал / белки / жиры / углеводы. <b>«Уточнить»</b> — данных нет в исходных записях, спросить у шефа. Крем, желатин и бисквиты — отдельные карты в разделе «Полуфабрикаты» и в начале раздела «Торты».</div>';
}
$("list").addEventListener("click",e=>{const b=e.target.closest(".item");if(b)location.hash="#k"+b.dataset.id;});

// ---- quantity scaling ----
// Scales only numbers that carry a unit ("20 / 30 г", "2 шт", "1 ч. л."); leaves "по 90 г", ratios "1:2", "на 10 порций", minutes untouched.
const NUM="(?:\\d+(?:[.,]\\d+)?|½|¼|¾)";
const UNIT="(?:г|кг|мл|л|шт|ч\\.\\s?л\\.|ст\\.\\s?л\\.|зубч[а-яё]*|банк[а-яё]*|упаков[а-яё]*|таблет[а-яё]*|шот[а-яё]*|ложк[а-яё]*)(?![а-яё])";
const CHAIN=new RegExp("("+NUM+"(?:\\s*[–-]\\s*"+NUM+")?(?:\\s*\\/\\s*"+NUM+"(?:\\s*[–-]\\s*"+NUM+")?)*)(\\s*)("+UNIT+")","gi");
const FR={"½":.5,"¼":.25,"¾":.75};
const toN=s=>FR[s]!=null?FR[s]:parseFloat(s.replace(",","."));
function fmt(n){
  if(Math.abs(n-Math.round(n))<1e-9) return String(Math.round(n));
  const r=n<10?Math.round(n*10)/10:Math.round(n);
  return String(r).replace(".",",");
}
function scale(str,k){
  if(k===1) return {s:str,changed:false};
  let changed=false;
  const s=str.replace(CHAIN,(m,nums,sp,unit,off,full)=>{
    const before=full.slice(Math.max(0,off-3),off).toLowerCase();
    if(/по\s$|на\s$/.test(before)) return m;
    changed=true;
    return nums.replace(new RegExp(NUM,"g"),x=>fmt(toN(x)*k))+sp+unit;
  });
  return {s,changed};
}

// ---- storage lookup for a card ----
const norm=s=>s.toLowerCase().replace(/[«»"()]/g,"").replace(/\s+/g," ").trim();
function storeFor(d){
  const n=norm(d.n);
  return ST.find(x=>{const m=norm(x.n.split(" · ")[0].split(" — ")[0]);return m.length>3&&(n===m||n.startsWith(m)||m.startsWith(n));});
}

// ---- card ----
function renderCard(){
  const X=$("detail");
  if(!cur){X.innerHTML='<div class="placeholder"><div class="big">Н<span style="display:inline-block;transform:scaleX(-1)">Н</span></div>Выберите позицию слева или найдите через поиск.</div>';return;}
  const d=cur;
  const tags=d.g.map(tagHtml).join("");
  const rows=d.c.map(([ing,qty])=>{
    const r=scale(qty,portions);
    return '<div class="ln'+(r.changed?" scaled":"")+(/уточнить/.test(qty)?" miss":"")+'"><span class="ing">'+esc(ing)+'</span><span class="dots"></span><span class="g">'+esc(r.s)+
      (r.changed?'<small>на 1: '+esc(qty)+'</small>':'')+'</span></div>';
  }).join("");
  const st=storeFor(d);
  const stHtml=st?'<div class="store"><b>Хранение:</b> '+(st.t?esc(st.t):st.src===3?"по спецификации поставщика":"срок не установлен")+
     ' · '+esc(st.w)+(st.T&&st.T!=="—"?' · '+esc(st.T):'')+'</div>':'';
  const quick=[1,2,3,5,10].map(n=>'<button data-n="'+n+'" aria-pressed="'+(portions===n)+'">×'+n+'</button>').join("");
  X.innerHTML='<div class="detail-in">'+
    '<button class="back" id="back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg>Все позиции</button>'+
    '<div class="hd"><div class="eyebrow">'+esc(d.s)+'</div><h1>'+esc(d.n)+'</h1>'+
      '<div class="facts"><span class="fact">Выход<b>'+esc(d.o)+'</b></span>'+
      (d.k&&d.k!=="—"?'<span class="fact">'+esc(d.kl||"КБЖУ на порцию")+'<b>'+esc(d.k)+'</b></span>':'')+
      (d.p&&d.p!=="—"?'<span class="fact">Цена<b>'+esc(d.p)+'</b></span>':'')+'</div>'+
      (tags?'<div class="tags">'+tags+'</div>':'')+
    '</div>'+
    '<div class="cols"><div>'+
      (d.img?'<figure class="shot"><img src="'+d.img+'" alt="Эталон подачи: '+esc(d.n)+'"><figcaption>Эталон подачи</figcaption></figure>':'')+
      '<h2>Состав · нетто</h2>'+
      '<div class="stepper"><span class="l">Порций / закладок: <b>'+portions+'</b></span>'+
        '<button class="sbtn" id="minus" aria-label="Меньше" '+(portions<=1?"disabled":"")+'>−</button>'+
        '<input class="sval" id="pv" type="number" inputmode="numeric" min="1" max="200" value="'+portions+'" aria-label="Количество порций">'+
        '<button class="sbtn" id="plus" aria-label="Больше">+</button>'+
        '<div class="quick" id="quick">'+quick+'</div></div>'+
      '<div class="ledger">'+rows+'</div>'+
      (portions>1?'<p class="hint">Пересчитаны граммы, мл и штуки. «По вкусу», пропорции и граммовки в тексте технологии — на 1 порцию.</p>':'')+
    '</div><div>'+
      '<h2>Технология</h2><div class="tech">'+d.t+'</div>'+
      (d.a?'<div class="algbox"><b>Аллергены:</b> '+esc(d.a)+'</div>':'')+
      (d.comp?'<div class="algbox"><b>Состав:</b> '+esc(d.comp)+'</div>':'')+stHtml+
      (d.f&&d.f.length?'<details class="q"><summary>Открытые вопросы к шефу · '+d.f.length+'</summary><ul>'+d.f.map(x=>'<li>'+esc(x)+'</li>').join("")+'</ul></details>':'')+
    '</div></div></div>';
  $("back").onclick=()=>{history.length>1&&location.hash?history.back():closeCard();};
  $("minus").onclick=()=>setPortions(portions-1);
  $("plus").onclick=()=>setPortions(portions+1);
  $("pv").onchange=e=>setPortions(parseInt(e.target.value,10)||1);
  $("quick").onclick=e=>{const b=e.target.closest("button");if(b)setPortions(+b.dataset.n);};
}
function setPortions(n){portions=Math.max(1,Math.min(200,n));renderCard();}

function openCard(id){
  const d=D.find(x=>x.id===id);if(!d) return;
  if(!cur||cur.id!==id) portions=1;
  cur=d;view="cards";syncButtons();
  document.body.classList.add("showing");
  renderCard();
  document.querySelectorAll(".item").forEach(b=>b.setAttribute("aria-current",+b.dataset.id===id));
  if(window.matchMedia("(min-width:900px)").matches) $("detail").scrollTop=0; else window.scrollTo(0,0);
}
function closeCard(keepHash){
  cur=null;document.body.classList.remove("showing");
  if(!keepHash&&location.hash) history.replaceState(null,"",location.pathname);
  renderCard();renderList();
}
function route(){
  const m=location.hash.match(/^#k(\d+)$/);
  if(m) openCard(+m[1]); else if(cur) closeCard(true);
}
window.addEventListener("hashchange",route);

// ---- storage view ----
function renderStore(){
  document.body.classList.remove("showing");cur=null;renderCard();
  const rows=ST.filter(x=>!q||(x.n+" "+x.c+" "+x.w+" "+x.t).toLowerCase().includes(q));
  let h='<div class="count">Сроки хранения · '+rows.length+'</div>';
  let last="";
  for(const x of rows){
    if(x.c!==last){h+='<div class="sechead">'+esc(x.c)+'</div>';last=x.c;}
    const term=x.t?esc(x.t):x.src===3?"по спецификации поставщика":"срок не установлен";
    h+='<div class="st"><div class="n">'+esc(x.n)+'</div><div class="t'+(x.src===0?" gap":"")+'">'+term+'</div>'+
      '<div class="w">'+esc(x.w)+(x.T&&x.T!=="—"?' · '+esc(x.T):'')+'</div>'+(x.r?'<div class="r">'+esc(x.r)+'</div>':'')+'</div>';
  }
  if(!rows.length) h+='<p class="empty">Ничего не нашлось.</p>';
  $("list").innerHTML=h;
}
